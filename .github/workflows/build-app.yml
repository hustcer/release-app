# Description:
#   - A reusable workflow for building and uploading Android/iOS apps
# Usage:
#   - Called by other workflows to build apps with different configurations
# REF:
#   1. https://docs.github.com/en/actions/using-workflows/reusing-workflows

name: Build App (Reusable)

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
        description: 'App name for output files'
      build-branch:
        type: string
        required: true
        description: 'Branch to build from'
      android:
        type: boolean
        required: false
        default: false
        description: 'Build Android app'
      ios:
        type: boolean
        required: false
        default: false
        description: 'Build iOS app'
      publish-to-gh:
        type: boolean
        required: false
        default: false
        description: 'Publish to GitHub Release'
      gh-version:
        type: string
        required: false
        default: 'v1.0.0'
        description: 'GitHub Release version'
      repo-url-var:
        type: string
        required: true
        description: 'Name of the repository URL variable (e.g., DEMO_REPO_URL)'
    secrets:
      CODE_PASS:
        required: true
      ERDA_GIT_TOKEN:
        required: true
      OSS_AK:
        required: true
      OSS_SK:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_BASE64:
        required: true
      IOS_AD_HOC_PROVISIONING_PROFILE_BASE64:
        required: true

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    if: inputs.ios == true || startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: hustcer/setup-nu@v3

    - name: Prepare code
      shell: nu {0}
      run: |
        let code = echo '${{ vars.APP_PREPARE_CODE }}' | openssl enc -d -aes-256-cbc -a -pbkdf2 -pass $'pass:${{ secrets.CODE_PASS }}' -iter 100
        echo $code o> prepare.nu

    - name: Prepareing
      run: nu prepare.nu && rm prepare.nu
      env:
        APP_REPO_URL: ${{ vars[inputs.repo-url-var] }}
        ERDA_GIT_TOKEN: ${{ secrets.ERDA_GIT_TOKEN }}
        APP_REPO_BRANCH: ${{ inputs.build-branch }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Show Env Info
      run: npx envinfo

    - name: Install dependencies
      shell: nu {0}
      run: |
        cd app-repo; pwd | print
        npm install --ignore-scripts
        cd ios; pod install

    - name: Install iOS certificates and provisioning profile
      env:
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_AD_HOC_PROVISIONING_PROFILE_BASE64 }}
      run: |
        # Create temp files
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate and provisioning profile
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to temporary keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Install provisioning profile to temporary keychain
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

    - name: Build iOS App
      run: |
        cd app-repo/ios
        # Disable automatic signing and device check
        defaults write com.apple.dt.Xcode IDESkipMacroValidation -bool YES

        set -o pipefail && xcodebuild -workspace *.xcworkspace -scheme "TrantorApp" \
          -configuration Release \
          DEVELOPMENT_TEAM="QNWSSM6MTS" \
          PROVISIONING_PROFILE_SPECIFIER="terp-adhoc" \
          PRODUCT_BUNDLE_IDENTIFIER="io.terminus.terp.app" \
          -archivePath build/app.xcarchive \
          archive \
          CODE_SIGN_STYLE="Manual" \
          CODE_SIGN_IDENTITY="iPhone Distribution" \
          ENABLE_BITCODE=NO \
          ONLY_ACTIVE_ARCH=NO \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          | xcbeautify --renderer github-actions

        # Export IPA
        # "ad-hoc" is deprecated at Xcode 15.4. Use "release-testing" instead.
        echo "Start exporting IPA..."
        set -o pipefail && xcodebuild -exportArchive \
          -archivePath build/app.xcarchive \
          -exportPath build/ipa \
          -exportOptionsPlist TrantorApp/ExportOptions.plist \
          -allowProvisioningUpdates \
          | xcbeautify --renderer github-actions

    - name: Show IPA Info
      shell: nu {0}
      run: |
        cd app-repo/ios
        echo "Show exported IPA..."
        ls **/*.ipa | table -w 200 | print
        mv build/ipa/TrantorApp.ipa build/ipa/${{ inputs.app-name }}.ipa
        print 'Rename IPA files:'
        ls -la build/ipa/*.ipa | table -w 200 | print

    - name: Setup OSS Util
      uses: yizhoumo/setup-ossutil@v2
      with:
        access-key-id: ${{ secrets.OSS_AK }}
        access-key-secret: ${{ secrets.OSS_SK }}
        endpoint: https://oss-cn-hangzhou.aliyuncs.com

    - name: Upload IPA to OSS
      shell: nu {0}
      run: |
        let APP_SUFFIX = ${{ vars.APP_SUFFIX }}
        let srcBranch = '${{ inputs.build-branch }}'
        let suffix = $APP_SUFFIX | get -o $srcBranch | default 'None'
        let dest = $'oss://terminus-new-trantor/fe-resources/app-pod/${{ inputs.app-name }}.($suffix).ipa'
        ossutil cp --force app-repo/ios/build/ipa/${{ inputs.app-name }}.ipa $dest

    - name: Publish Archive
      uses: softprops/action-gh-release@v2.1.0
      if: inputs.publish-to-gh == true
      with:
        draft: true
        name: "${{ inputs.gh-version }}"
        files: './app-repo/ios/build/ipa/${{ inputs.app-name }}.ipa'
        body: "Build from commit ${{ env.BUILD_REF }} at ${{ env.BUILD_DATE }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    if: inputs.android == true || startsWith(github.ref, 'refs/tags/')
    container: reactnativecommunity/react-native-android
    steps:
    - uses: hustcer/setup-nu@v3

    - name: Prepare code
      shell: nu {0}
      run: |
        let code = echo '${{ vars.APP_PREPARE_CODE }}' | openssl enc -d -aes-256-cbc -a -pbkdf2 -pass $'pass:${{ secrets.CODE_PASS }}' -iter 100
        echo $code o> prepare.nu

    - name: Prepareing
      run: nu prepare.nu && rm prepare.nu
      env:
        APP_REPO_URL: ${{ vars[inputs.repo-url-var] }}
        ERDA_GIT_TOKEN: ${{ secrets.ERDA_GIT_TOKEN }}
        APP_REPO_BRANCH: ${{ inputs.build-branch }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Show Env Info
      run: npx envinfo

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: /root/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Android App
      shell: nu {0}
      run: |
        cd app-repo; pwd | print
        npm install --ignore-scripts
        cd android; chmod +x gradlew
        print '::group::Gradle assembleRelease'
        ./gradlew assembleRelease
        print '::endgroup::'
        print 'Build Android App Success:'
        ls **/*.apk | table -w 200 | print
        mv app/build/outputs/apk/release/app-arm64-v8a-release.apk app/build/outputs/apk/release/${{ inputs.app-name }}-arm64.apk
        mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk app/build/outputs/apk/release/${{ inputs.app-name }}-armv7a.apk
        print 'Rename APK files:'
        ls app/build/outputs/apk/release/*.apk | table -w 200 | print

    - name: Setup OSS Util
      uses: yizhoumo/setup-ossutil@v2
      with:
        access-key-id: ${{ secrets.OSS_AK }}
        access-key-secret: ${{ secrets.OSS_SK }}
        endpoint: https://oss-cn-hangzhou.aliyuncs.com

    - name: Upload APK to OSS
      shell: nu {0}
      run: |
        let APP_SUFFIX = ${{ vars.APP_SUFFIX }}
        let srcBranch = '${{ inputs.build-branch }}'
        let suffix = $APP_SUFFIX | get -o $srcBranch | default 'None'
        const releaseDir = 'app-repo/android/app/build/outputs/apk/release'
        const storePath = 'oss://terminus-new-trantor/fe-resources/app-pod'
        ossutil cp --force $'($releaseDir)/${{ inputs.app-name }}-arm64.apk' $'($storePath)/${{ inputs.app-name }}-arm64.($suffix).apk'
        ossutil cp --force $'($releaseDir)/${{ inputs.app-name }}-armv7a.apk' $'($storePath)/${{ inputs.app-name }}-armv7a.($suffix).apk'

    - name: Publish Archive
      uses: softprops/action-gh-release@v2.1.0
      if: inputs.publish-to-gh == true
      with:
        draft: true
        name: "${{ inputs.gh-version }}"
        files: |
          ./app-repo/android/app/build/outputs/apk/release/${{ inputs.app-name }}-arm64.apk
          ./app-repo/android/app/build/outputs/apk/release/${{ inputs.app-name }}-armv7a.apk
        body: "Build from commit ${{ env.BUILD_REF }} at ${{ env.BUILD_DATE }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

