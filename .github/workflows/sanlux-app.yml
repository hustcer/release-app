# Description:
#   - A github workflow for building and uploading the Sanlux app (apk and ipa)
#   - This workflow calls the reusable build-app.yml workflow
# REF:
#   1. https://docs.github.com/en/actions/using-workflows/reusing-workflows

name: Build Sanlux Apps

on:
  workflow_dispatch:
    inputs:
      build-branch:
        type: choice
        required: true
        default: 'release/latest'
        description: 'Build Branch'
        options:
          - master
          - release/latest
          - develop
      android:
        type: boolean
        default: false
        required: false
        description: 'Build Android'
      ios:
        type: boolean
        default: false
        required: false
        description: 'Build iOS'
      publish-to-gh:
        type: boolean
        default: false
        required: false
        description: 'Publish to GitHub'
      gh-version:
        required: true
        default: 'v1.1.0'
        description: 'Github Version'

# Fix Resource not accessible by integration 403 error
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build Sanlux App
    uses: ./.github/workflows/build-app.yml
    with:
      app-name: 'SanluxPda'
      xcode-scheme: 'SanluxPda'
      repo-url-var: SANLUX_REPO_URL
      extra-env-json: ${{ vars.SANLUX_EXTRA_ENV }}
      ios: ${{ github.event.inputs.ios == 'true' }}
      android: ${{ github.event.inputs.android == 'true' }}
      build-branch: ${{ github.event.inputs.build-branch }}
      gh-version: ${{ github.event.inputs.gh-version }}
      publish-to-gh: ${{ github.event.inputs.publish-to-gh == 'true' }}
    # secrets: inherit  # 🎯 继承所有 secrets，这种方式更简洁但可能不安全
    secrets:
      OSS_AK: ${{ secrets.OSS_AK }}
      OSS_SK: ${{ secrets.OSS_SK }}
      # 在 reusable workflow 中，secrets 不会自动继承，必须显式传递
      CODE_PASS: ${{ secrets.CODE_PASS }}
      ERDA_GIT_TOKEN: ${{ secrets.ERDA_GIT_TOKEN }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_AD_HOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_AD_HOC_PROVISIONING_PROFILE_BASE64 }}
